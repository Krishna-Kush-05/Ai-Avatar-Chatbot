{% extends "app_layout.html" %}

{% block app_content %}
<style>
    .qa-table {
        width: 100%;
        border-collapse: collapse;
    }

    .qa-table thead {
        background-color: var(--color-bg-secondary);
        border-bottom: 2px solid var(--color-border);
    }

    .qa-table th {
        padding: 1rem;
        text-align: left;
        font-weight: 600;
        color: var(--color-text-dark);
    }

    .qa-table tbody tr {
        border-bottom: 1px solid var(--color-border);
        transition: background-color 0.2s ease;
    }

    .qa-table tbody tr:hover {
        background-color: rgba(0, 0, 0, 0.02);
    }

    .qa-table td {
        padding: 1rem;
        color: var(--color-text);
    }

    .qa-question {
        font-weight: 600;
        color: var(--color-text-dark);
        margin-bottom: 0.25rem;
    }

    .qa-answer {
        color: var(--color-text);
        line-height: 1.5;
        margin-bottom: 0.5rem;
        max-height: 60px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .qa-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.5rem;
    }

    .qa-tag {
        display: inline-block;
        background-color: #e8f0fe;
        color: #1a73e8;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
    }

    .qa-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
    }

    .empty-state {
        text-align: center;
        padding: 2rem;
        color: var(--color-text-light);
    }

    .empty-state-icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }
</style>

<div class="page-header">
    <h1>Knowledge Base Management</h1>
    <p>Add, view, and manage Q&A pairs for your AI assistants.</p>
</div>

<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
    <!-- Left: Add Q&A Form -->
    <div class="card">
        <div class="card-header">
            <h3>Add New Q&A Pair</h3>
        </div>
        <form id="qa-form" onsubmit="addKnowledge(); return false;">
            <div class="card-body">
                <div class="form-group">
                    <label for="question">Question</label>
                    <textarea id="question" name="question" class="form-control" rows="3"
                        placeholder="Enter a question..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="answer">Answer</label>
                    <textarea id="answer" name="answer" class="form-control" rows="4" placeholder="Enter the answer..."
                        required></textarea>
                </div>
                <div class="form-group">
                    <label for="tags">Tags (comma separated)</label>
                    <input type="text" id="tags" name="tags" class="form-control"
                        placeholder="e.g., admissions, fee, contact">
                </div>
            </div>
            <div class="card-footer">
                <button type="button" class="btn btn-primary" onclick="addKnowledge()">Add to Knowledge Base</button>
            </div>
        </form>

        <!-- Add Status -->
        <div id="add-status" style="display:none; margin-top: 1rem;">
            <div class="card">
                <div class="card-body">
                    <div id="add-message" class="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right: Existing Q&A Status -->
    <div class="card">
        <div class="card-header">
            <h3>Existing Q&A Status</h3>
        </div>
        <div class="card-body" id="qa-status">
            <p style="color: var(--color-text-light);">Loading...</p>
        </div>
    </div>
</div>

<!-- Full Width: Existing Q&A Pairs Table -->
<div class="card">
    <div class="card-header">
        <h3>Existing Q&A Pairs</h3>
    </div>
    <div class="card-body" style="padding: 0;">
        <div id="qa-list"></div>
    </div>
</div>
<script>
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function loadKnowledgeBase() {
        const container = document.getElementById("qa-list");
        const statusContainer = document.getElementById('qa-status');

        try {
            const res = await fetch('/api/knowledge', { cache: 'no-store' });
            if (!res.ok) {
                if (res.redirected && res.url.includes('/login')) {
                    throw new Error('Session expired. Please reload the page to log in.');
                }
                throw new Error('Server error: ' + res.status);
            }

            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                if (text.includes('<html')) {
                    throw new Error('Session expired. Please reload the page to log in.');
                }
                throw new Error('Invalid JSON from server');
            }

            if (!Array.isArray(data)) {
                const errMsg = data.error || 'Unexpected response from server';
                if (container) container.innerHTML = `<p style="color: red; padding: 1rem;">Error: ${errMsg}</p>`;
                if (statusContainer) statusContainer.innerHTML = `<p style="color: red;">Error: ${errMsg}</p>`;
                return;
            }

            const totalPairs = data.length;
            const tagCount = new Set();
            data.forEach(item => {
                if (item.tags) {
                    item.tags.split(',').forEach(tag => { if (tag.trim()) tagCount.add(tag.trim()); });
                }
            });

            let statusHtml = '<ul style="list-style: none; padding: 0;">';
            statusHtml += `<li style="padding: 0.5rem 0;"><strong>Total Q&A Pairs:</strong> <span style="font-size: 1.5rem; color: #1a73e8; font-weight: bold;">${totalPairs}</span></li>`;
            statusHtml += `<li style="padding: 0.5rem 0;"><strong>Unique Tags:</strong> <span style="font-size: 1.5rem; color: #34a853; font-weight: bold;">${tagCount.size}</span></li>`;
            statusHtml += '</ul>';
            if (statusContainer) statusContainer.innerHTML = statusHtml;

            if (container) {
                container.innerHTML = "";
                if (data.length > 0) {
                    const table = document.createElement('table');
                    table.className = 'qa-table';

                    const thead = document.createElement('thead');
                    thead.innerHTML = '<tr><th style="width: 30%;">Question</th><th style="width: 40%;">Answer</th><th style="width: 20%;">Tags</th><th style="width: 10%; text-align: right;">Action</th></tr>';
                    table.appendChild(thead);

                    const tbody = document.createElement('tbody');

                    data.forEach(item => {
                        const row = document.createElement('tr');
                        const tags = item.tags ? item.tags.split(',').map(t => t.trim()).filter(t => t) : [];
                        const tagsHtml = tags.length > 0
                            ? tags.map(tag => `<span class="qa-tag">${escapeHtml(tag)}</span>`).join('')
                            : '<span style="color: var(--color-text-light);">No tags</span>';

                        row.innerHTML = `
                            <td><div class="qa-question">${escapeHtml(item.question)}</div></td>
                            <td><div class="qa-answer">${escapeHtml(item.answer)}</div></td>
                            <td><div class="qa-tags">${tagsHtml}</div></td>
                            <td style="text-align: right;">
                                <button type="button" class="btn btn-sm btn-danger" onclick="deleteKnowledge(${item.id})">Delete</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });

                    table.appendChild(tbody);
                    container.appendChild(table);
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No Q&A pairs yet. Add your first pair above!</p></div>';
                }
            }
        } catch (error) {
            if (container) container.innerHTML = `<p style="color: red; padding: 1rem;">Failed to load knowledge base: ${escapeHtml(error.message)}</p>`;
            if (statusContainer) statusContainer.innerHTML = '<p style="color: red;">Failed to load</p>';
            console.error('KB Load Error:', error);
        }
    }

    async function addKnowledge() {
        try {
            const questionEl = document.getElementById('question');
            const answerEl = document.getElementById('answer');
            const tagsEl = document.getElementById('tags');
            
            if (!questionEl || !answerEl) {
                alert('Form inputs not found. Please reload the page.');
                return;
            }

            const question = questionEl.value.trim();
            const answer = answerEl.value.trim();
            const tags = tagsEl ? tagsEl.value.trim() : "";

            if (!question || !answer) {
                alert('Question and Answer are required');
                return;
            }

            const addStatus = document.getElementById('add-status');
            const addMessage = document.getElementById('add-message');

            if (addStatus) addStatus.style.display = 'block';
            if (addMessage) addMessage.innerHTML = '<p style="color:#007bff;margin:0;">Adding...</p>';

            const response = await fetch('/api/add_knowledge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, answer, tags })
            });

            let result;
            try {
                result = await response.json();
            } catch (e) {
                if (response.redirected && response.url.includes('/login')) {
                    throw new Error('Session expired. Please reload the page to log in.');
                }
                throw new Error('Invalid response from server.');
            }

            if (!response.ok) {
                throw new Error(result.error || result.detail || 'Failed to add knowledge');
            }

            await loadKnowledgeBase();
            
            const form = document.getElementById('qa-form');
            if (form) form.reset();

            if (addMessage) addMessage.innerHTML = '<p style="color:green;margin:0;"><strong>✓ Success:</strong> Knowledge added.</p>';
            if (addStatus) setTimeout(() => { addStatus.style.display = 'none'; }, 3000);

        } catch (err) {
            console.error(err);
            const addStatus = document.getElementById('add-status');
            const addMessage = document.getElementById('add-message');
            if (addStatus && addMessage) {
                addStatus.style.display = 'block';
                addMessage.innerHTML = `<p style="color:red;margin:0;"><strong>Error:</strong> ${escapeHtml(err.message)}</p>`;
            } else {
                alert('Error: ' + err.message);
            }
        }
    }

    async function deleteKnowledge(id) {
        if (!confirm('Delete Q&A pair?')) return;

        try {
            const response = await fetch(`/api/delete_knowledge/${id}`, { method: 'DELETE' });
            let result;
            try {
                result = await response.json();
            } catch (e) {
                if (response.redirected && response.url.includes('/login')) {
                    throw new Error('Session expired. Please reload the page to log in.');
                }
                throw new Error('Invalid response from server.');
            }
            if (response.ok) {
                await loadKnowledgeBase();
            } else {
                alert('Failed to delete: ' + (result.error || 'Server error'));
            }
        } catch (error) {
            alert('Failed to delete: ' + error.message);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadKnowledgeBase();
        
        const form = document.getElementById('qa-form');
        if (form) {
            form.onsubmit = function(e) {
                e.preventDefault();
                addKnowledge();
                return false;
            };
        }
    });
</script>
{% endblock %}
